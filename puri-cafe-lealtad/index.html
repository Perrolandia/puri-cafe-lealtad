<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Püri Café — Tarjeta de lealtad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --puri-blue:#004AAD;
    --puri-blue-dark:#003580;
    --puri-yellow:#FFF0B1;
    --puri-brown:#BA6C3D;
    --puri-black:#000000;
    --puri-white:#FFFFFF;
    --bg-warm:#FFFDF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:var(--bg-warm);
    color:var(--puri-black);
    min-height:100vh;
  }
  header{
    background:var(--puri-yellow);
    padding:2rem 1.5rem 1.75rem;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header .carita{
    position:absolute;
    top:14px;
    right:18px;
    width:34px;
    opacity:0.9;
  }
  header img.logo{
    width:150px;
    display:block;
    margin:0 auto;
  }
  .config-warning{
    background:#FCEBEB;
    color:#791F1F;
    font-size:0.8rem;
    text-align:center;
    padding:10px 16px;
    display:none;
  }
  nav{
    display:flex;
    justify-content:center;
    gap:0;
    background:var(--puri-white);
    border-bottom:1px solid #eee;
  }
  nav button{
    flex:1;
    max-width:220px;
    padding:14px 10px;
    background:none;
    border:none;
    font-family:'Poppins',sans-serif;
    font-size:0.85rem;
    font-weight:500;
    letter-spacing:0.5px;
    color:#999;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  nav button.active{
    color:var(--puri-blue);
    border-bottom:3px solid var(--puri-blue);
  }
  main{
    max-width:480px;
    margin:0 auto;
    padding:1.5rem 1.25rem 1rem;
  }
  .view{display:none;}
  .view.active{display:block;}
  .field{margin-bottom:1rem;}
  .field label{
    display:block;
    font-size:0.8rem;
    color:#666;
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:'Poppins',sans-serif;
    font-size:0.95rem;
  }
  .field input:focus{
    outline:none;
    border-color:var(--puri-blue);
  }
  .btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--puri-blue);
    color:var(--puri-white);
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:0.95rem;
    cursor:pointer;
    margin-top:4px;
  }
  .btn:active{background:var(--puri-blue-dark);}
  .btn:disabled{opacity:0.4;cursor:default;}
  .card{
    background:var(--puri-white);
    border-radius:16px;
    padding:1.5rem;
    margin-top:1.25rem;
    box-shadow:0 2px 14px rgba(0,0,0,0.06);
    position:relative;
    overflow:hidden;
  }
  .card .carita-bg{
    position:absolute;
    bottom:-10px;
    right:-10px;
    width:70px;
    opacity:0.12;
  }
  .card-name{
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    margin:0 0 4px;
  }
  .card-phone{
    font-size:0.8rem;
    color:#999;
    margin:0 0 1.25rem;
  }
  .stamps{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:1.25rem;
  }
  .stamp{
    aspect-ratio:1;
    border-radius:50%;
    border:2px dashed #ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
    position:relative;
  }
  .stamp.filled{
    border:2px solid var(--puri-brown);
    background:var(--puri-brown);
    color:var(--puri-white);
  }
  .stamp.milestone::after{
    content:attr(data-mark);
    position:absolute;
    bottom:-18px;
    font-size:0.6rem;
    color:var(--puri-blue);
    font-weight:600;
    white-space:nowrap;
  }
  .rewards{margin-top:1.75rem;}
  .reward{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border-radius:10px;
    background:var(--puri-yellow);
    margin-bottom:10px;
    font-size:0.85rem;
  }
  .reward.locked{
    background:#f2f2f2;
    color:#aaa;
  }
  .reward-label{font-weight:500;}
  .reward-note{
    font-size:0.7rem;
    color:#8a6d2f;
    display:block;
    margin-top:2px;
  }
  .reward.locked .reward-note{color:#bbb;}
  .reward button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:var(--puri-blue);
    color:#fff;
    font-size:0.75rem;
    font-weight:500;
    cursor:pointer;
  }
  .msg{
    text-align:center;
    font-size:0.85rem;
    color:#999;
    padding:2rem 0;
  }
  .msg.error{color:#c0392b;}
  .galeria{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:1.5rem 1.25rem 0.5rem;
    max-width:480px;
    margin:0 auto;
  }
  .galeria img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:12px;
    flex-shrink:0;
  }
  footer{
    text-align:center;
    padding:1.5rem 1.25rem 2rem;
    max-width:480px;
    margin:0 auto;
  }
  footer .social{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  footer .social a{
    color:var(--puri-blue);
    text-decoration:none;
    font-size:0.8rem;
    font-weight:500;
  }
  footer .brand{
    font-size:0.7rem;
    color:#bbb;
  }
</style>
</head>
<body>

<header>
  <img class="carita" src="assets/carita-azul.png" alt="">
  <img class="logo" src="assets/logo-puri.png" alt="Püri Café">
</header>

<p class="config-warning" id="config-warning">
  Falta conectar la base de datos (Firebase). Revisa el archivo LEEME.md para completar la configuración.
</p>

<nav>
  <button id="tab-staff" class="active">Staff</button>
  <button id="tab-cliente">Mi tarjeta</button>
</nav>

<main>

  <section id="view-staff" class="view active">
    <div class="field">
      <label>Número de celular del cliente</label>
      <input type="tel" id="staff-phone" placeholder="998 123 4567">
    </div>
    <button class="btn" id="staff-buscar">Buscar cliente</button>
    <div id="staff-resultado"></div>
  </section>

  <section id="view-cliente" class="view">
    <div class="field">
      <label>Ingresa tu número de celular</label>
      <input type="tel" id="cliente-phone" placeholder="998 123 4567">
    </div>
    <button class="btn" id="cliente-buscar">Ver mi tarjeta</button>
    <div id="cliente-resultado"></div>
  </section>

</main>

<div class="galeria">
  <img src="assets/foto-1.png" alt="Iced latte Püri Café">
  <img src="assets/foto-2.png" alt="Café Püri Café">
  <img src="assets/foto-3.png" alt="Preparación Püri Café">
  <img src="assets/foto-4.png" alt="Servido Püri Café">
</div>

<footer>
  <div class="social">
    <a href="https://instagram.com/puri.cafe" target="_blank" rel="noopener">Instagram @puri.cafe</a>
    <a href="tel:+529841825512">984 182 5512</a>
    <a href="https://share.google/QbGlse7mx625PXnV8" target="_blank" rel="noopener">Ubicación</a>
  </div>
  <p class="brand">Tarjeta de lealtad digital · Püri Café</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>

// ============================================================
// 1) PEGA AQUI TU CONFIGURACION DE FIREBASE (Proyecto > Configuracion > SDK)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBD_EvK-4AZnveUBc1N43cLDnOy1BGs3Z8",
  authDomain: "puricafe-46e97.firebaseapp.com",
  projectId: "puricafe-46e97",
  storageBucket: "puricafe-46e97.firebasestorage.app",
  messagingSenderId: "617636517509",
  appId: "1:617636517509:web:c66bcf67d2021030043bec"
};
// ============================================================

const configPendiente = Object.values(firebaseConfig).some(v => String(v).startsWith('TU_'));

if(configPendiente){
  document.getElementById('config-warning').style.display = 'block';
  document.getElementById('staff-buscar').disabled = true;
  document.getElementById('cliente-buscar').disabled = true;
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const TOTAL_SELLOS = 10;
const META_1 = 5;
const META_2 = 10;

function limpiarTel(v){ return v.replace(/\D/g,''); }

function tabs(){
  const staffTab = document.getElementById('tab-staff');
  const clienteTab = document.getElementById('tab-cliente');
  const staffView = document.getElementById('view-staff');
  const clienteView = document.getElementById('view-cliente');
  staffTab.onclick = () => {
    staffTab.classList.add('active'); clienteTab.classList.remove('active');
    staffView.classList.add('active'); clienteView.classList.remove('active');
  };
  clienteTab.onclick = () => {
    clienteTab.classList.add('active'); staffTab.classList.remove('active');
    clienteView.classList.add('active'); staffView.classList.remove('active');
  };
}
tabs();

function renderStamps(stamps){
  let html = '<div class="stamps">';
  for(let i=1;i<=TOTAL_SELLOS;i++){
    const filled = i <= stamps;
    const milestone = i === META_1 ? 'data-mark="30% off"' : (i === META_2 ? 'data-mark="Latte gratis"' : '');
    const mClass = (i === META_1 || i === META_2) ? 'milestone' : '';
    html += `<div class="stamp ${filled?'filled':''} ${mClass}" ${milestone}>${filled?'&#9679;':''}</div>`;
  }
  html += '</div>';
  return html;
}

function renderRewards(cliente, editable){
  const has5 = cliente.stamps >= META_1;
  const used5 = cliente.reward5Used;
  const has10 = cliente.stamps >= META_2;
  let html = '<div class="rewards">';
  html += `<div class="reward ${has5 && !used5 ? '' : 'locked'}">
    <div>
      <span class="reward-label">30% de descuento</span>
      <span class="reward-note">Se desbloquea en la 5ta visita</span>
    </div>
    ${editable && has5 && !used5 ? '<button id="btn-usar-5">Usar</button>' : (used5 ? '<span style="font-size:0.7rem;color:#999;">Usado</span>' : '')}
  </div>`;
  html += `<div class="reward ${has10 ? '' : 'locked'}">
    <div>
      <span class="reward-label">Iced latte gratis</span>
      <span class="reward-note">10ma visita · no aplica affogato latte</span>
    </div>
    ${editable && has10 ? '<button id="btn-usar-10">Usar y reiniciar</button>' : ''}
  </div>`;
  html += '</div>';
  return html;
}

async function getCliente(tel){
  const ref = db.collection('clientes').doc(tel);
  const snap = await ref.get();
  return { ref, snap };
}

document.getElementById('staff-buscar').onclick = async () => {
  const tel = limpiarTel(document.getElementById('staff-phone').value);
  const cont = document.getElementById('staff-resultado');
  if(!tel){ cont.innerHTML = '<p class="msg error">Ingresa un número válido.</p>'; return; }
  cont.innerHTML = '<p class="msg">Buscando…</p>';

  try{
    const { ref, snap } = await getCliente(tel);

    if(!snap.exists){
      cont.innerHTML = `
        <div class="card">
          <p class="card-name">Cliente nuevo</p>
          <p class="card-phone">${tel}</p>
          <div class="field">
            <label>Nombre del cliente</label>
            <input type="text" id="nuevo-nombre" placeholder="Nombre">
          </div>
          <button class="btn" id="crear-cliente">Crear tarjeta</button>
        </div>`;
      document.getElementById('crear-cliente').onclick = async () => {
        const nombre = document.getElementById('nuevo-nombre').value.trim() || 'Cliente';
        await ref.set({ name: nombre, phone: tel, stamps: 0, reward5Used: false, createdAt: Date.now() });
        cargarTarjetaStaff(tel);
      };
      return;
    }
    cargarTarjetaStaff(tel);
  }catch(e){
    cont.innerHTML = '<p class="msg error">No se pudo conectar. Revisa la configuración de Firebase en LEEME.md.</p>';
  }
};

async function cargarTarjetaStaff(tel){
  const cont = document.getElementById('staff-resultado');
  const { ref, snap } = await getCliente(tel);
  const cliente = snap.data();

  cont.innerHTML = `
    <div class="card">
      <img class="carita-bg" src="assets/carita-azul.png" alt="">
      <p class="card-name">${cliente.name}</p>
      <p class="card-phone">${cliente.phone}</p>
      ${renderStamps(cliente.stamps)}
      <button class="btn" id="btn-sellar" ${cliente.stamps >= TOTAL_SELLOS ? 'disabled' : ''}>+ 1 sello</button>
      ${renderRewards(cliente, true)}
    </div>`;

  const btnSellar = document.getElementById('btn-sellar');
  if(btnSellar){
    btnSellar.onclick = async () => {
      await ref.update({ stamps: firebase.firestore.FieldValue.increment(1) });
      cargarTarjetaStaff(tel);
    };
  }
  const btn5 = document.getElementById('btn-usar-5');
  if(btn5){
    btn5.onclick = async () => {
      await ref.update({ reward5Used: true });
      cargarTarjetaStaff(tel);
    };
  }
  const btn10 = document.getElementById('btn-usar-10');
  if(btn10){
    btn10.onclick = async () => {
      await ref.update({ stamps: 0, reward5Used: false });
      cargarTarjetaStaff(tel);
    };
  }
}

document.getElementById('cliente-buscar').onclick = async () => {
  const tel = limpiarTel(document.getElementById('cliente-phone').value);
  const cont = document.getElementById('cliente-resultado');
  if(!tel){ cont.innerHTML = '<p class="msg error">Ingresa un número válido.</p>'; return; }
  cont.innerHTML = '<p class="msg">Buscando…</p>';

  try{
    const { snap } = await getCliente(tel);
    if(!snap.exists){
      cont.innerHTML = '<p class="msg">Aún no tienes una tarjeta. Pregunta en el mostrador.</p>';
      return;
    }
    const cliente = snap.data();
    cont.innerHTML = `
      <div class="card">
        <img class="carita-bg" src="assets/carita-azul.png" alt="">
        <p class="card-name">${cliente.name}</p>
        <p class="card-phone">${cliente.phone}</p>
        ${renderStamps(cliente.stamps)}
        ${renderRewards(cliente, false)}
      </div>`;
  }catch(e){
    cont.innerHTML = '<p class="msg error">No se pudo conectar. Revisa la configuración de Firebase en LEEME.md.</p>';
  }
};

</script>
</body>
</html>
